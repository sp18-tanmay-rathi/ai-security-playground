[project]
name = "ai-security-playground"
version = "0.1.0"
description = "A safe, deterministic red-team playground for testing common AI application security failure modes."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "streamlit>=1.49,<2",
  "pandas>=2.0,<4",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
